[resources]
cpus = 4
memory = "8g"
[services.postgres]
enabled = true
[commands]
setup = ["pnpm install --frozen-lockfile", "pnpm db:contract"]
migrate = ["pnpm db:prepare"]
build = ["pnpm build"]
start = "pnpm start"
verify = "pnpm verify"
[application]
port = 8080
readiness = "/health/ready"
[env]
NODE_ENV = "test"
HTTP_PORT = "8080"
PRISMA_DISABLE_TELEMETRY = "1"
DBOS_EXECUTOR_ID = "sandbox-app-1"
