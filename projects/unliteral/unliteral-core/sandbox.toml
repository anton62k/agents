[resources]
cpus = 4
memory = "8g"

[services.postgres]
enabled = true

[services.redis]
enabled = true

[commands]
setup = ["pnpm install --frozen-lockfile"]
migrate = ["pnpm db:migrate:deploy"]
build = [
  "pnpm --filter @revisium/model-routing-engine build",
  "pnpm build",
]
start = "pnpm start"
verify = "pnpm verify"

[application]
port = 19223
readiness = "/health/ready"

[env]
AI_ROUTING_CONFIG_JSON = '{"schemaVersion":1,"profileId":"sandbox-v1","strategy":"first_valid","candidates":[{"id":"sandbox","model":"model/sandbox","timeoutMs":1000}]}'
NODE_ENV = "test"
LOG_LEVEL = "warn"
TELEGRAM_WEBHOOK_SECRET = "test-telegram-webhook-secret"
UNLITERAL_CONTENT_API_URL = "https://content.test.invalid"
UNLITERAL_CONTENT_API_KEY = "sandbox-content-api-key"
UNLITERAL_CONTENT_COURSE_ID = "ru-en"
UNLITERAL_CONTENT_MODE = "preview"
