[commands]
setup = [
  '''
set -euo pipefail
sudo -n apt-get update
sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install \
  -y --no-install-recommends xz-utils
for utility in mkdir mktemp chmod cat ls cut awk rm mv sleep cp gzip xz setsid rmdir tar; do
  command -v "$utility" >/dev/null || {
    printf 'Missing required utility: %s\n' "$utility" >&2
    exit 1
  }
done
xz --version
''',
  "pnpm install --frozen-lockfile",
]
build = []
verify = "pnpm verify"

[env]
REVO_RUN_REAL_INSTALLER_INTEGRATION = "0"
