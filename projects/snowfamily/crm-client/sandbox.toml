[runtime]
node = "14.20.1"
npm = "6.14.17"

[resources]
cpus = 4
memory = "6g"

[commands]
setup = ["npm ci --ignore-scripts", "npm run graphql-codegen"]
build = ["npm run build"]
start = './node_modules/.bin/ng serve --host 0.0.0.0 --port 4200 --disable-host-check --proxy-config "$SANDBOX_STATE_DIR/proxy.json"'
verify = "npm run build"

[application]
port = 4200
readiness = "/"
readinessTimeout = 180

[env]
NODE_ENV = "development"
